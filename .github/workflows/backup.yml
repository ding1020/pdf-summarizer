name: Database Backup

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      manual_backup_name:
        description: "Backup name suffix (optional)"
        required: false
        type: string

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  backup:
    name: Create Database Backup
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create backup directory
        run: mkdir -p backups

      - name: Generate backup filename
        id: backup-name
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SUFFIX="${{ github.event.inputs.manual_backup_name || '' }}"
          BACKUP_NAME="backup_${TIMESTAMP}${SUFFIX:+_${SUFFIX}}"
          echo "name=$BACKUP_NAME" >> $GITHUB_OUTPUT

      - name: Backup database with pg_dump
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=plain > "backups/${{ steps.backup-name.outputs.name }}.sql"
          echo "Backup size: $(du -h backups/*.sql | cut -f1)"

      - name: Upload backup to storage
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.backup-name.outputs.name }}
          path: backups/
          retention-days: 30

      - name: Clean up local backup
        run: rm -f backups/*.sql

  backup-notify:
    name: Notify Backup Status
    runs-on: ubuntu-latest
    needs: backup
    if: always()
    
    steps:
      - name: Send notification on failure
        if: needs.backup.result == 'failure'
        run: |
          echo "::warning::Database backup failed! Please check the logs."
          exit 1

      - name: Send notification on success
        if: needs.backup.result == 'success'
        run: echo "Database backup completed successfully."
